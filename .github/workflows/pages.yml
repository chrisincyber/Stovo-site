# Checks the site and publishes it to GitHub Pages (https://stovo.ch).
# Settings → Pages → Source must be "GitHub Actions"; the custom domain is set there too.
name: Pages

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", ".gitignore"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        run: python3 scripts/check_links.py
      - name: Collect the site
        # Only what is served: the README, scripts and workflow are not published.
        run: |
          mkdir _site
          cp -R index.html 404.html CNAME privacy support assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
